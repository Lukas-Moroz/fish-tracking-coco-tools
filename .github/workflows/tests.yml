name: Helper tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check participant example
        run: |
          python release_dataset.py build examples/dataset --release-id demo_001 --output /tmp/demo_001/private
          python release_dataset.py participants /tmp/demo_001/private --output /tmp/demo_001/participants
          python prediction_loader.py /tmp/demo_001/participants --split train --output /tmp/example_windows.jsonl
